<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cavite Node Network — MidtermLab2</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@300;400;500&display=swap');

  :root {
    --bg:        #0b0f1a;
    --surface:   #111827;
    --border:    #1e2d45;
    --accent:    #00d4ff;
    --accent2:   #ff6b35;
    --accent3:   #39ff14;
    --text:      #e8f4fd;
    --muted:     #5a7a9a;
    --node-fill: #0e1e35;
    --edge:      #1e3a5f;
    --highlight: #00d4ff;
    --path:      #ff6b35;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── Background grid ── */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(0,212,255,.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,212,255,.04) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  header {
    position: relative; z-index: 1;
    padding: 28px 40px 20px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: flex-end; gap: 20px; flex-wrap: wrap;
  }

  .logo-block h1 {
    font-family: 'Syne', sans-serif;
    font-size: clamp(1.4rem, 3vw, 2rem);
    font-weight: 800;
    letter-spacing: -0.02em;
    color: var(--accent);
    text-transform: uppercase;
  }
  .logo-block p {
    font-size: .72rem;
    color: var(--muted);
    letter-spacing: .1em;
    text-transform: uppercase;
    margin-top: 2px;
  }

  .badge {
    background: var(--border);
    border: 1px solid var(--accent);
    color: var(--accent);
    font-size: .65rem;
    letter-spacing: .12em;
    padding: 4px 10px;
    border-radius: 2px;
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .main-layout {
    position: relative; z-index: 1;
    display: grid;
    grid-template-columns: 1fr 340px;
    gap: 0;
    height: calc(100vh - 93px);
  }

  /* ── Canvas area ── */
  .canvas-wrap {
    position: relative;
    border-right: 1px solid var(--border);
    overflow: hidden;
  }

  #graphCanvas {
    width: 100%;
    height: 100%;
    display: block;
    cursor: crosshair;
  }

  .canvas-label {
    position: absolute;
    top: 16px; left: 20px;
    font-size: .65rem;
    letter-spacing: .14em;
    color: var(--muted);
    text-transform: uppercase;
  }

  /* Zoom controls */
  .zoom-btns {
    position: absolute;
    bottom: 20px; left: 20px;
    display: flex; gap: 6px;
  }
  .zoom-btns button {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    width: 32px; height: 32px;
    border-radius: 3px;
    font-size: 1.1rem;
    cursor: pointer;
    transition: border-color .2s;
  }
  .zoom-btns button:hover { border-color: var(--accent); color: var(--accent); }

  /* Legend */
  .legend {
    position: absolute;
    bottom: 20px; right: 20px;
    background: rgba(17,24,39,.85);
    border: 1px solid var(--border);
    padding: 10px 14px;
    font-size: .63rem;
    color: var(--muted);
    line-height: 1.8;
    backdrop-filter: blur(8px);
  }
  .legend span { display: inline-block; width: 24px; height: 2px; vertical-align: middle; margin-right: 6px; }
  .leg-edge { background: var(--edge); }
  .leg-path { background: var(--path); }
  .leg-node-std { background: var(--accent); border-radius: 50%; width: 8px; height: 8px; }
  .leg-node-sel { background: var(--accent2); border-radius: 50%; width: 8px; height: 8px; }

  /* ── Side panel ── */
  .side-panel {
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  .panel-section {
    padding: 20px 22px;
    border-bottom: 1px solid var(--border);
  }
  .panel-section h3 {
    font-family: 'Syne', sans-serif;
    font-size: .75rem;
    font-weight: 700;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 14px;
  }

  /* Select dropdowns */
  .select-row { display: flex; flex-direction: column; gap: 10px; }
  .sel-group { display: flex; flex-direction: column; gap: 5px; }
  .sel-group label {
    font-size: .65rem;
    letter-spacing: .1em;
    color: var(--muted);
    text-transform: uppercase;
  }
  .sel-group select {
    background: var(--node-fill);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: .78rem;
    border-radius: 3px;
    outline: none;
    cursor: pointer;
    transition: border-color .2s;
  }
  .sel-group select:focus { border-color: var(--accent); }

  /* Criteria tabs */
  .criteria-tabs {
    display: flex; gap: 6px; margin-bottom: 14px;
  }
  .crit-btn {
    flex: 1;
    background: var(--node-fill);
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    font-size: .65rem;
    letter-spacing: .08em;
    text-transform: uppercase;
    padding: 7px 4px;
    border-radius: 3px;
    cursor: pointer;
    transition: all .2s;
  }
  .crit-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--bg);
    font-weight: 500;
  }
  .crit-btn:not(.active):hover { border-color: var(--accent); color: var(--accent); }

  /* Run button */
  .run-btn {
    width: 100%;
    background: transparent;
    border: 1px solid var(--accent);
    color: var(--accent);
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: .85rem;
    letter-spacing: .1em;
    text-transform: uppercase;
    padding: 11px;
    border-radius: 3px;
    cursor: pointer;
    transition: all .25s;
    position: relative;
    overflow: hidden;
    margin-top: 8px;
  }
  .run-btn::before {
    content: '';
    position: absolute; inset: 0;
    background: var(--accent);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform .25s;
    z-index: -1;
  }
  .run-btn:hover { color: var(--bg); }
  .run-btn:hover::before { transform: scaleX(1); }

  /* Result card */
  .result-card {
    background: var(--node-fill);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 14px;
    font-size: .72rem;
    line-height: 1.7;
    display: none;
  }
  .result-card.visible { display: block; }

  .path-display {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: .95rem;
    color: var(--accent2);
    word-break: break-all;
    margin-bottom: 10px;
    letter-spacing: -.01em;
  }
  .arrow { color: var(--muted); }

  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 6px;
    margin-top: 8px;
  }
  .stat-box {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 8px 6px;
    text-align: center;
  }
  .stat-box .val {
    font-family: 'Syne', sans-serif;
    font-size: 1.05rem;
    font-weight: 800;
    color: var(--accent3);
  }
  .stat-box .lbl {
    font-size: .58rem;
    color: var(--muted);
    letter-spacing: .08em;
    text-transform: uppercase;
    margin-top: 1px;
  }

  .no-path {
    color: var(--accent2);
    font-family: 'Syne', sans-serif;
    font-size: .85rem;
  }

  /* All paths table */
  .all-paths {
    font-size: .66rem;
    color: var(--muted);
    line-height: 1.9;
  }
  .all-paths .path-row {
    display: flex;
    justify-content: space-between;
    padding: 4px 0;
    border-bottom: 1px solid rgba(30,45,69,.5);
  }
  .all-paths .path-row:last-child { border-bottom: none; }
  .all-paths .path-row .nodes { color: var(--text); }

  /* Edge table */
  .edge-table {
    width: 100%;
    border-collapse: collapse;
    font-size: .63rem;
  }
  .edge-table th {
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .08em;
    text-align: left;
    padding: 4px 6px;
    border-bottom: 1px solid var(--border);
    font-weight: 400;
  }
  .edge-table td {
    padding: 4px 6px;
    border-bottom: 1px solid rgba(30,45,69,.4);
    color: var(--text);
  }
  .edge-table tr:hover td { background: rgba(0,212,255,.04); }
  .edge-table .from { color: var(--accent); }
  .edge-table .to   { color: var(--accent2); }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  /* Tooltip */
  #tooltip {
    position: fixed;
    background: rgba(17,24,39,.97);
    border: 1px solid var(--accent);
    color: var(--text);
    font-size: .65rem;
    padding: 8px 12px;
    border-radius: 3px;
    pointer-events: none;
    display: none;
    z-index: 100;
    line-height: 1.7;
    max-width: 180px;
  }
  #tooltip.show { display: block; }
</style>
</head>
<body>

<header>
  <div class="logo-block">
    <h1>Cavite Node Network</h1>
    <p>Graph Visualization &amp; Shortest Path Analyzer</p>
  </div>
  <div class="badge">MidtermLab2 · Dijkstra's Algorithm</div>
</header>

<div class="main-layout">

  <!-- CANVAS -->
  <div class="canvas-wrap">
    <div class="canvas-label">// NODE MAP — CAVITE REGION</div>
    <canvas id="graphCanvas"></canvas>
    <div class="zoom-btns">
      <button id="zoomIn" title="Zoom In">+</button>
      <button id="zoomOut" title="Zoom Out">−</button>
      <button id="resetView" title="Reset">⌂</button>
    </div>
    <div class="legend">
      <div><span class="leg-edge" style="display:inline-block"></span> Route edge</div>
      <div><span class="leg-path" style="display:inline-block"></span> Shortest path</div>
      <div style="margin-top:4px;display:flex;align-items:center;gap:6px;"><span class="leg-node-std" style="display:inline-block"></span> Node</div>
      <div style="display:flex;align-items:center;gap:6px;"><span class="leg-node-sel" style="display:inline-block"></span> Selected</div>
    </div>
  </div>

  <!-- SIDE PANEL -->
  <div class="side-panel">

    <!-- Controls -->
    <div class="panel-section">
      <h3>// Shortest Path</h3>
      <div class="select-row">
        <div class="sel-group">
          <label>Start Node</label>
          <select id="startNode"></select>
        </div>
        <div class="sel-group">
          <label>End Node</label>
          <select id="endNode"></select>
        </div>
      </div>

      <div style="margin-top:14px;">
        <div style="font-size:.65rem;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;margin-bottom:8px;">Optimize By</div>
        <div class="criteria-tabs">
          <button class="crit-btn active" data-crit="distance">Distance</button>
          <button class="crit-btn" data-crit="time">Time</button>
          <button class="crit-btn" data-crit="fuel">Fuel</button>
        </div>
      </div>

      <button class="run-btn" id="runBtn">▶ Find Shortest Path</button>
    </div>

    <!-- Result -->
    <div class="panel-section">
      <h3>// Result</h3>
      <div class="result-card" id="resultCard">
        <div class="path-display" id="pathDisplay"></div>
        <div class="stats-grid" id="statsGrid"></div>
      </div>
    </div>

    <!-- All-pairs summary -->
    <div class="panel-section" id="allPathsSection" style="display:none;">
      <h3>// All Paths (selected criteria)</h3>
      <div class="all-paths" id="allPaths"></div>
    </div>

    <!-- Edge table -->
    <div class="panel-section">
      <h3>// Edge Data</h3>
      <table class="edge-table">
        <thead>
          <tr>
            <th>From</th><th>To</th><th>km</th><th>min</th><th>L</th>
          </tr>
        </thead>
        <tbody id="edgeTbody"></tbody>
      </table>
    </div>

  </div>
</div>

<div id="tooltip"></div>

<script>
// ═══════════════════════════════════════════
//  DATA
// ═══════════════════════════════════════════
const edges = [
  {from:"IMUS",     to:"BACOOR",   distance:10, time:15, fuel:1.2},
  {from:"BACOOR",   to:"DASMA",    distance:12, time:25, fuel:1.5},
  {from:"DASMA",    to:"KAWIT",    distance:12, time:25, fuel:1.5},
  {from:"KAWIT",    to:"INDANG",   distance:12, time:25, fuel:1.2},
  {from:"INDANG",   to:"SILANG",   distance:14, time:25, fuel:1.5},
  {from:"SILANG",   to:"GENTRI",   distance:10, time:25, fuel:1.3},
  {from:"GENTRI",   to:"NOVELETA", distance:10, time:25, fuel:1.5},
  {from:"NOVELETA", to:"IMUS",     distance:10, time:15, fuel:1.2},
  {from:"BACOOR",   to:"SILANG",   distance:10, time:25, fuel:1.3},
  {from:"DASMA",    to:"SILANG",   distance:12, time:25, fuel:1.5},
  {from:"SILANG",   to:"BACOOR",   distance:10, time:25, fuel:1.3},
  {from:"NOVELETA", to:"BACOOR",   distance:10, time:15, fuel:1.2},
  {from:"SILANG",   to:"KAWIT",    distance:14, time:25, fuel:1.2},
  {from:"IMUS",     to:"NOVELETA", distance:10, time:15, fuel:1.2},
];

const nodeNames = [...new Set(edges.flatMap(e => [e.from, e.to]))];

// Node positions (hand-tuned for clarity, relative 0-1)
const nodePos = {
  IMUS:     {x:.30, y:.42},
  BACOOR:   {x:.50, y:.28},
  DASMA:    {x:.65, y:.42},
  KAWIT:    {x:.62, y:.62},
  INDANG:   {x:.45, y:.78},
  SILANG:   {x:.68, y:.78},
  GENTRI:   {x:.82, y:.62},
  NOVELETA: {x:.18, y:.30},
};

// ═══════════════════════════════════════════
//  BUILD GRAPH (adjacency list)
// ═══════════════════════════════════════════
function buildGraph() {
  const g = {};
  nodeNames.forEach(n => g[n] = []);
  edges.forEach(e => {
    g[e.from].push({node: e.to, distance: e.distance, time: e.time, fuel: e.fuel});
  });
  return g;
}
const graph = buildGraph();

// ═══════════════════════════════════════════
//  DIJKSTRA
// ═══════════════════════════════════════════
function dijkstra(start, end, criterion) {
  const dist = {};
  const prev = {};
  const visited = new Set();

  nodeNames.forEach(n => { dist[n] = Infinity; prev[n] = null; });
  dist[start] = 0;

  const pq = [{node: start, cost: 0}];

  while (pq.length) {
    pq.sort((a, b) => a.cost - b.cost);
    const {node: u} = pq.shift();
    if (visited.has(u)) continue;
    visited.add(u);
    if (u === end) break;

    for (const nb of (graph[u] || [])) {
      const newCost = dist[u] + nb[criterion];
      if (newCost < dist[nb.node]) {
        dist[nb.node] = newCost;
        prev[nb.node] = u;
        pq.push({node: nb.node, cost: newCost});
      }
    }
  }

  if (dist[end] === Infinity) return null;

  const path = [];
  let cur = end;
  while (cur) { path.unshift(cur); cur = prev[cur]; }

  // Calculate all three totals along actual path
  let totalDist = 0, totalTime = 0, totalFuel = 0;
  for (let i = 0; i < path.length - 1; i++) {
    const from = path[i], to = path[i+1];
    const edge = edges.find(e => e.from === from && e.to === to);
    if (edge) {
      totalDist += edge.distance;
      totalTime += edge.time;
      totalFuel += edge.fuel;
    }
  }

  return { path, totalDist, totalTime, totalFuel };
}

// ═══════════════════════════════════════════
//  CANVAS
// ═══════════════════════════════════════════
const canvas = document.getElementById('graphCanvas');
const ctx = canvas.getContext('2d');

let scale = 1;
let offsetX = 0, offsetY = 0;
let pathEdges = new Set(); // set of "FROM→TO" strings for highlighted path
let selectedNodes = new Set();

function resizeCanvas() {
  const wrap = canvas.parentElement;
  canvas.width = wrap.clientWidth;
  canvas.height = wrap.clientHeight;
  drawGraph();
}

function worldToScreen(xRel, yRel) {
  const w = canvas.width, h = canvas.height;
  const pad = 80;
  const bx = pad + (xRel * (w - pad*2)) * scale + offsetX;
  const by = pad + (yRel * (h - pad*2)) * scale + offsetY;
  return {x: bx, y: by};
}

function drawArrow(x1, y1, x2, y2, r) {
  const angle = Math.atan2(y2-y1, x2-x1);
  const tx = x2 - Math.cos(angle) * (r + 4);
  const ty = y2 - Math.sin(angle) * (r + 4);
  ctx.lineTo(tx, ty);
  // arrow head
  ctx.save();
  ctx.translate(tx, ty);
  ctx.rotate(angle);
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(-9, -4);
  ctx.lineTo(-9,  4);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawGraph() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const R = 22 * scale;

  // Compute screen positions
  const sPos = {};
  nodeNames.forEach(n => {
    sPos[n] = worldToScreen(nodePos[n].x, nodePos[n].y);
  });

  // ── Draw edges ──
  edges.forEach(e => {
    const key = `${e.from}→${e.to}`;
    const isPath = pathEdges.has(key);

    const p1 = sPos[e.from];
    const p2 = sPos[e.to];

    ctx.save();
    if (isPath) {
      ctx.strokeStyle = '#ff6b35';
      ctx.lineWidth = 3.5 * scale;
      ctx.shadowColor = '#ff6b35';
      ctx.shadowBlur = 12;
    } else {
      ctx.strokeStyle = '#1e3a5f';
      ctx.lineWidth = 1.5 * scale;
      ctx.shadowBlur = 0;
    }
    ctx.fillStyle = isPath ? '#ff6b35' : '#1e3a5f';

    ctx.beginPath();
    ctx.moveTo(p1.x, p1.y);
    drawArrow(p1.x, p1.y, p2.x, p2.y, R);
    ctx.stroke();
    ctx.fill();
    ctx.restore();

    // Edge label (midpoint)
    const mx = (p1.x + p2.x) / 2;
    const my = (p1.y + p2.y) / 2;
    const angle = Math.atan2(p2.y - p1.y, p2.x - p1.x);
    const perp = angle + Math.PI/2;
    const offset = 12 * scale;
    const lx = mx + Math.cos(perp) * offset;
    const ly = my + Math.sin(perp) * offset;

    if (scale > 0.6) {
      ctx.save();
      ctx.font = `${Math.floor(9.5*scale)}px JetBrains Mono, monospace`;
      ctx.fillStyle = isPath ? 'rgba(255,107,53,.9)' : 'rgba(90,122,154,.7)';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(`${e.distance}km`, lx, ly);
      ctx.restore();
    }
  });

  // ── Draw nodes ──
  nodeNames.forEach(n => {
    const {x, y} = sPos[n];
    const isSelected = selectedNodes.has(n);

    // Glow
    ctx.save();
    ctx.shadowColor = isSelected ? '#ff6b35' : '#00d4ff';
    ctx.shadowBlur = isSelected ? 20 : 12;

    // Circle
    ctx.beginPath();
    ctx.arc(x, y, R, 0, Math.PI*2);
    ctx.fillStyle = isSelected ? '#1a1000' : '#0e1e35';
    ctx.fill();
    ctx.strokeStyle = isSelected ? '#ff6b35' : '#00d4ff';
    ctx.lineWidth = 2 * scale;
    ctx.stroke();
    ctx.restore();

    // Label
    ctx.save();
    ctx.font = `bold ${Math.floor(10*scale)}px Syne, sans-serif`;
    ctx.fillStyle = isSelected ? '#ff6b35' : '#e8f4fd';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(n, x, y);
    ctx.restore();
  });
}

// ═══════════════════════════════════════════
//  POPULATE UI
// ═══════════════════════════════════════════
function populateSelects() {
  const s = document.getElementById('startNode');
  const e = document.getElementById('endNode');
  nodeNames.forEach(n => {
    s.innerHTML += `<option value="${n}">${n}</option>`;
    e.innerHTML += `<option value="${n}">${n}</option>`;
  });
  e.value = 'SILANG';

  // Edge table
  const tbody = document.getElementById('edgeTbody');
  edges.forEach(ed => {
    tbody.innerHTML += `<tr>
      <td class="from">${ed.from}</td>
      <td class="to">${ed.to}</td>
      <td>${ed.distance}</td>
      <td>${ed.time}</td>
      <td>${ed.fuel.toFixed(1)}</td>
    </tr>`;
  });
}

// ═══════════════════════════════════════════
//  CRITERIA TABS
// ═══════════════════════════════════════════
let activeCriterion = 'distance';
document.querySelectorAll('.crit-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.crit-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeCriterion = btn.dataset.crit;
  });
});

// ═══════════════════════════════════════════
//  RUN DIJKSTRA
// ═══════════════════════════════════════════
document.getElementById('runBtn').addEventListener('click', () => {
  const start = document.getElementById('startNode').value;
  const end   = document.getElementById('endNode').value;

  if (start === end) {
    showResult(null, start, end);
    return;
  }

  const result = dijkstra(start, end, activeCriterion);
  showResult(result, start, end);

  // Highlight
  pathEdges = new Set();
  selectedNodes = new Set([start, end]);
  if (result) {
    for (let i = 0; i < result.path.length - 1; i++) {
      pathEdges.add(`${result.path[i]}→${result.path[i+1]}`);
      selectedNodes.add(result.path[i]);
      selectedNodes.add(result.path[i+1]);
    }
  }
  drawGraph();
});

function showResult(result, start, end) {
  const card = document.getElementById('resultCard');
  card.classList.add('visible');

  if (!result || start === end) {
    document.getElementById('pathDisplay').innerHTML =
      `<span class="no-path">${start === end ? 'Start and end are the same.' : 'No path found.'}</span>`;
    document.getElementById('statsGrid').innerHTML = '';
    return;
  }

  const pathStr = result.path.map((n, i) =>
    i < result.path.length - 1
      ? `<span style="color:var(--accent2)">${n}</span><span class="arrow"> → </span>`
      : `<span style="color:var(--accent2)">${n}</span>`
  ).join('');

  document.getElementById('pathDisplay').innerHTML = pathStr;
  document.getElementById('statsGrid').innerHTML = `
    <div class="stat-box">
      <div class="val">${result.totalDist} km</div>
      <div class="lbl">Distance</div>
    </div>
    <div class="stat-box">
      <div class="val">${result.totalTime} min</div>
      <div class="lbl">Time</div>
    </div>
    <div class="stat-box">
      <div class="val">${result.totalFuel.toFixed(1)} L</div>
      <div class="lbl">Fuel</div>
    </div>
  `;

  // Console output (for verification)
  console.log(`\n=== Shortest Path (${activeCriterion}) ===`);
  console.log(`From: ${start} → To: ${end}`);
  console.log(`Path: ${result.path.join(' → ')}`);
  console.log(`Total Distance: ${result.totalDist} km`);
  console.log(`Total Time:     ${result.totalTime} mins`);
  console.log(`Total Fuel:     ${result.totalFuel.toFixed(1)} Liters`);
}

// ═══════════════════════════════════════════
//  TOOLTIP ON HOVER
// ═══════════════════════════════════════════
const tooltip = document.getElementById('tooltip');

canvas.addEventListener('mousemove', (e) => {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  const R = 22 * scale;

  const sPos = {};
  nodeNames.forEach(n => {
    sPos[n] = worldToScreen(nodePos[n].x, nodePos[n].y);
  });

  // Check node hover
  let hovered = null;
  for (const n of nodeNames) {
    const {x, y} = sPos[n];
    if (Math.hypot(mx - x, my - y) < R + 4) { hovered = n; break; }
  }

  if (hovered) {
    const outs = edges.filter(ed => ed.from === hovered);
    const ins  = edges.filter(ed => ed.to   === hovered);
    tooltip.innerHTML = `
      <strong style="color:var(--accent)">${hovered}</strong><br>
      Out-edges: ${outs.length} | In-edges: ${ins.length}
      ${outs.map(ed => `<br><span style="color:var(--muted)">→ ${ed.to}:</span> ${ed.distance}km / ${ed.time}min / ${ed.fuel}L`).join('')}
    `;
    tooltip.classList.add('show');
    tooltip.style.left = (e.clientX + 14) + 'px';
    tooltip.style.top  = (e.clientY - 10) + 'px';
  } else {
    // Check edge hover
    let hovEdge = null;
    for (const ed of edges) {
      const p1 = sPos[ed.from], p2 = sPos[ed.to];
      const dist = pointToSegmentDist(mx, my, p1.x, p1.y, p2.x, p2.y);
      if (dist < 7) { hovEdge = ed; break; }
    }
    if (hovEdge) {
      tooltip.innerHTML = `
        <span style="color:var(--accent)">${hovEdge.from}</span> → <span style="color:var(--accent2)">${hovEdge.to}</span><br>
        📍 ${hovEdge.distance} km &nbsp;⏱ ${hovEdge.time} min &nbsp;⛽ ${hovEdge.fuel} L
      `;
      tooltip.classList.add('show');
      tooltip.style.left = (e.clientX + 14) + 'px';
      tooltip.style.top  = (e.clientY - 10) + 'px';
    } else {
      tooltip.classList.remove('show');
    }
  }
});

canvas.addEventListener('mouseleave', () => tooltip.classList.remove('show'));

function pointToSegmentDist(px, py, ax, ay, bx, by) {
  const dx = bx-ax, dy = by-ay;
  const t = Math.max(0, Math.min(1, ((px-ax)*dx + (py-ay)*dy) / (dx*dx + dy*dy)));
  return Math.hypot(px - (ax+t*dx), py - (ay+t*dy));
}

// ═══════════════════════════════════════════
//  ZOOM
// ═══════════════════════════════════════════
document.getElementById('zoomIn').addEventListener('click', () => { scale = Math.min(scale * 1.25, 3); drawGraph(); });
document.getElementById('zoomOut').addEventListener('click', () => { scale = Math.max(scale / 1.25, 0.3); drawGraph(); });
document.getElementById('resetView').addEventListener('click', () => { scale = 1; offsetX = 0; offsetY = 0; drawGraph(); });

// Pan
let panning = false, panStart = {};
canvas.addEventListener('mousedown', e => { panning = true; panStart = {x: e.clientX - offsetX, y: e.clientY - offsetY}; canvas.style.cursor='grabbing'; });
canvas.addEventListener('mousemove', e => { if (!panning) return; offsetX = e.clientX - panStart.x; offsetY = e.clientY - panStart.y; drawGraph(); });
canvas.addEventListener('mouseup', () => { panning = false; canvas.style.cursor='crosshair'; });
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const delta = e.deltaY < 0 ? 1.1 : 0.9;
  scale = Math.max(0.3, Math.min(3, scale * delta));
  drawGraph();
}, {passive: false});

// ═══════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════
window.addEventListener('resize', resizeCanvas);
populateSelects();
resizeCanvas();
</script>
